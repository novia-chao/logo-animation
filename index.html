<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Squint — Logo Animation</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0C0C0E;
    --panel: #111114;
    --border: #222228;
    --text: #E8E8EA;
    --dim: #55556A;
    --accent: #6B9BF2;
    --accent-dim: rgba(107,155,242,0.15);
  }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Inter', sans-serif;
    font-size: 13px;
    -webkit-font-smoothing: antialiased;
  }

  .app {
    display: grid;
    grid-template-columns: 1fr 268px;
    height: 100vh;
    overflow: hidden;
  }

  /* ── Display ── */
  .display {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    background: radial-gradient(ellipse at 50% 45%, #15151E 0%, #0C0C0E 72%);
    padding-top: 20px;
  }

  .canvas-center {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
  }

  .tabs {
    display: flex;
    gap: 2px;
    background: rgba(255,255,255,0.05);
    border-radius: 10px;
    padding: 3px;
  }
  .tab {
    padding: 5px 14px;
    border-radius: 7px;
    border: none;
    background: transparent;
    color: var(--dim);
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    letter-spacing: 0.02em;
    transition: background 0.15s, color 0.15s;
  }
  .tab.active { background: var(--accent); color: #fff; }

  .canvas-wrap {
    border-radius: 6px;
    filter: drop-shadow(0 0 32px rgba(107,155,242,0.08));
  }
  canvas { display: block; border-radius: 6px; }

  /* ── Controls ── */
  .controls {
    border-left: 1px solid var(--border);
    background: var(--panel);
    display: flex;
    flex-direction: column;
    overflow-y: auto;
    overflow-x: hidden;
  }

  .ctrl-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 18px 18px 14px;
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    background: var(--panel);
    z-index: 1;
  }
  .ctrl-title {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--dim);
  }

  .pause-btn {
    display: flex;
    align-items: center;
    gap: 5px;
    padding: 4px 10px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text);
    font-size: 11px;
    font-weight: 500;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s;
  }
  .pause-btn:hover { background: rgba(255,255,255,0.05); border-color: rgba(255,255,255,0.15); }
  .pause-btn.paused { color: var(--accent); border-color: var(--accent); background: var(--accent-dim); }

  .rec-btn {
    display: flex;
    align-items: center;
    gap: 5px;
    padding: 4px 10px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text);
    font-size: 11px;
    font-weight: 500;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s, color 0.15s;
  }
  .rec-btn:hover { background: rgba(255,255,255,0.05); border-color: rgba(255,255,255,0.15); }
  .rec-btn.recording { color: #F26B6B; border-color: #F26B6B; background: rgba(242,107,107,0.12); }
  .rec-dot { font-size: 8px; line-height: 1; }
  .header-btns { display: flex; gap: 6px; align-items: center; }

  .ctrl-body { padding: 16px 18px; flex: 1; display: flex; flex-direction: column; }

  .section { margin-bottom: 20px; }
  .section-label {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--dim);
    margin-bottom: 12px;
  }

  .ctrl-row { margin-bottom: 14px; }
  .ctrl-row:last-child { margin-bottom: 0; }

  .ctrl-label {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 6px;
  }
  .ctrl-name { font-size: 12px; color: var(--text); font-weight: 450; }
  .ctrl-val { font-size: 11px; color: var(--dim); font-variant-numeric: tabular-nums; }

  input[type="range"] {
    -webkit-appearance: none;
    appearance: none;
    width: 100%;
    height: 3px;
    border-radius: 2px;
    background: var(--border);
    outline: none;
    cursor: pointer;
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 13px; height: 13px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-dim);
    cursor: pointer;
    transition: box-shadow 0.15s;
  }
  input[type="range"]::-webkit-slider-thumb:hover { box-shadow: 0 0 0 5px var(--accent-dim); }
  input[type="range"]::-moz-range-thumb {
    width: 13px; height: 13px;
    border: none; border-radius: 50%;
    background: var(--accent);
    cursor: pointer;
  }

  .dir-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 4px;
  }
  .dir-btn-wide { grid-column: 1 / -1; }
  .dir-btn {
    padding: 7px 0;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--dim);
    font-size: 13px;
    cursor: pointer;
    transition: background 0.12s, color 0.12s, border-color 0.12s;
    text-align: center;
  }
  .dir-btn:hover { background: rgba(255,255,255,0.05); color: var(--text); }
  .dir-btn.active { background: var(--accent); color: #fff; border-color: transparent; }

  .seg {
    display: flex;
    background: rgba(255,255,255,0.04);
    border-radius: 7px;
    padding: 2px;
    gap: 2px;
  }
  .seg-btn {
    flex: 1;
    padding: 5px 0;
    border-radius: 5px;
    border: none;
    background: transparent;
    color: var(--dim);
    font-size: 11px;
    font-weight: 500;
    cursor: pointer;
    transition: background 0.12s, color 0.12s;
    text-align: center;
  }
  .seg-btn.active { background: var(--accent); color: #fff; }

  .color-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 14px;
  }
  .color-swatch {
    width: 28px; height: 28px;
    border-radius: 6px;
    border: 1px solid rgba(255,255,255,0.1);
    overflow: hidden;
    cursor: pointer;
    position: relative;
    flex-shrink: 0;
  }
  .color-swatch input[type="color"] {
    opacity: 0;
    position: absolute;
    inset: 0;
    width: 100%; height: 100%;
    cursor: pointer;
    border: none;
    padding: 0;
  }
  .color-hex { font-size: 12px; color: var(--dim); font-variant-numeric: tabular-nums; letter-spacing: 0.03em; }

  .ctrl-footer {
    padding: 12px 18px;
    border-top: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    position: sticky;
    bottom: 0;
    background: var(--panel);
  }
  .stat { font-size: 11px; color: var(--dim); display: flex; gap: 4px; align-items: baseline; }
  .stat-val { color: var(--text); font-variant-numeric: tabular-nums; }

  hr.divider { border: none; border-top: 1px solid var(--border); margin: 4px 0 20px; }
  .hidden { display: none !important; }

  .rec-progress {
    height: 2px;
    background: var(--border);
    border-radius: 1px;
    margin-top: 8px;
    overflow: hidden;
    display: none;
  }
  .rec-progress.active { display: block; }
  .rec-progress-bar {
    height: 100%;
    background: #F26B6B;
    border-radius: 1px;
    width: 0%;
    transition: width 0.1s linear;
  }
</style>
<script src="https://cdn.jsdelivr.net/npm/gif.js@0.2.0/dist/gif.js"></script>
</head>
<body>
<div class="app">

  <div class="display">
    <div class="tabs">
      <button class="tab" data-view="v1">Dot Fill</button>
      <button class="tab active" data-view="v2">Logo Grid</button>
    </div>
    <div class="canvas-center">
      <div class="canvas-wrap">
        <canvas id="c1" class="hidden"></canvas>
        <canvas id="c2"></canvas>
      </div>
    </div>
  </div>

  <aside class="controls">
    <div class="ctrl-header">
      <span class="ctrl-title">Controls</span>
      <div class="header-btns">
        <button class="pause-btn" id="pauseBtn">
          <span id="pauseIcon">⏸</span>
          <span id="pauseLabel">Pause</span>
        </button>
        <button class="rec-btn" id="recBtn">
          <span class="rec-dot" id="recDot">●</span>
          <span id="recLabel">Rec</span>
        </button>
      </div>
    </div>

    <div class="ctrl-body">

      <div class="section">
        <div class="section-label">Export</div>
        <div class="ctrl-row">
          <div class="ctrl-label"><span class="ctrl-name">Duration</span></div>
          <div class="seg" id="durSeg">

      </div>

        </div>

        <div class="ctrl-row">
          <div class="ctrl-label">
            <span class="ctrl-name">Wave width</span>
            <span class="ctrl-val" id="valWave">0.62</span>
          </div>
          <input type="range" id="slWave" min="0.05" max="1.5" step="0.01" value="0.62">
        </div>

        <div class="ctrl-row">
          <div class="ctrl-label"><span class="ctrl-name">Direction</span></div>
          <div class="dir-grid">
            <button class="dir-btn" data-dir="top">↓</button>
            <button class="dir-btn" data-dir="left">→</button>
            <button class="dir-btn" data-dir="bottom">↑</button>
            <button class="dir-btn" data-dir="right">←</button>
            <button class="dir-btn" data-dir="radial">◎</button>
            <button class="dir-btn" data-dir="diagonal">⤢</button>
            <button class="dir-btn dir-btn-wide active" data-dir="blink">Blink</button>
          </div>
        </div>
      </div>

      <hr class="divider">

      <div class="section">
        <div class="section-label">Color</div>

        <div class="color-row">
          <div class="color-swatch" id="swatchWrap" style="background:#FFFFFF">
            <input type="color" id="colorPicker" value="#FFFFFF">
          </div>
          <span class="color-hex" id="colorHex">#FFFFFF</span>
        </div>

        <div class="ctrl-row">
          <div class="ctrl-label">
            <span class="ctrl-name">Min opacity</span>
            <span class="ctrl-val" id="valMinOp">0.08</span>
          </div>
          <input type="range" id="slMinOp" min="0" max="0.9" step="0.01" value="0.08">
        </div>

        <div class="ctrl-row">
          <div class="ctrl-label">
            <span class="ctrl-name">Max opacity</span>
            <span class="ctrl-val" id="valMaxOp">1.00</span>
          </div>
          <input type="range" id="slMaxOp" min="0.1" max="1" step="0.01" value="1">
        </div>

        <div class="ctrl-row">
          <div class="ctrl-label"><span class="ctrl-name">Pulse mode</span></div>
          <div class="seg">
            <button class="seg-btn active" data-pulse="opacity">Opacity</button>
            <button class="seg-btn" data-pulse="scale">Scale</button>
            <button class="seg-btn" data-pulse="both">Both</button>
          </div>
        </div>
      </div>

      <hr class="divider">

      <!-- V1 controls -->
      <div class="section hidden" id="secV1">
        <div class="section-label">Dot Fill</div>
        <div class="ctrl-row">
          <div class="ctrl-label">
            <span class="ctrl-name">Dot size</span>
            <span class="ctrl-val" id="valDotR">2.5px</span>
          </div>
          <input type="range" id="slDotR" min="1" max="6" step="0.25" value="2.5">
        </div>
        <div class="ctrl-row">
          <div class="ctrl-label">
            <span class="ctrl-name">Spacing</span>
            <span class="ctrl-val" id="valSpacing">7px</span>
          </div>
          <input type="range" id="slSpacing" min="3" max="18" step="0.5" value="7">
        </div>
      </div>

      <!-- V2 controls -->
      <div class="section" id="secV2">
        <div class="section-label">Logo Grid</div>
        <div class="ctrl-row">
          <div class="ctrl-label">
            <span class="ctrl-name">Tile size</span>
            <span class="ctrl-val" id="valTileSize">28px</span>
          </div>
          <input type="range" id="slTileSize" min="10" max="60" step="1" value="28">
        </div>
        <div class="ctrl-row">
          <div class="ctrl-label">
            <span class="ctrl-name">Tile gap</span>
            <span class="ctrl-val" id="valTileGap">8px</span>
          </div>
          <input type="range" id="slTileGap" min="0" max="24" step="1" value="8">
        </div>

        <div class="section-label" style="margin-top:14px">Canvas size</div>
        <div class="ctrl-row">
          <div class="ctrl-label">
            <span class="ctrl-name">Width</span>
            <span class="ctrl-val" id="valGridW">436px</span>
          </div>
          <input type="range" id="slGridW" min="160" max="720" step="4" value="436">
        </div>
        <div class="ctrl-row">
          <div class="ctrl-label">
            <span class="ctrl-name">Height</span>
            <span class="ctrl-val" id="valGridH">148px</span>
          </div>
          <input type="range" id="slGridH" min="120" max="560" step="4" value="148">
        </div>

        <div class="ctrl-row">
          <div class="ctrl-label"><span class="ctrl-name">Aspect ratio</span></div>
          <div class="seg" id="aspectSeg">
            <button class="seg-btn" data-aspect="1:1">1∶1</button>
            <button class="seg-btn" data-aspect="4:3">4∶3</button>
            <button class="seg-btn" data-aspect="16:9">16∶9</button>
            <button class="seg-btn" data-aspect="free">Free</button>
          </div>

    </div>

    <div class="ctrl-footer">
      <span class="stat"><span class="stat-val" id="statCount">—</span> <span id="statUnit">dots</span></span>
      <span class="stat"><span class="stat-val" id="statFps">—</span> fps</span>
    </div>
  </aside>
</div>

<script>
'use strict';

const SVG_PATH_D = `M26.9033 40.0244C28.4492 40.0245 29.9313 40.6416 31.0244 41.7393C32.1176 42.837 32.7324 44.3255 32.7324 45.8779V56.4609C32.7329 62.7186 35.2086 68.7199 39.6152 73.1445C44.0219 77.5692 49.9987 80.0547 56.2305 80.0547H66.7607C68.3068 80.0548 69.7895 80.6719 70.8828 81.7695C71.9763 82.8676 72.5908 84.3573 72.5908 85.9102V107.07C72.5908 107.839 72.4405 108.6 72.1475 109.311C71.8544 110.021 71.4243 110.666 70.8828 111.21C70.3414 111.753 69.6984 112.185 68.9912 112.479C68.284 112.772 67.5261 112.924 66.7607 112.924H45.6875C44.9221 112.924 44.1642 112.773 43.457 112.479C42.7497 112.184 42.1067 111.754 41.5654 111.21C41.0241 110.666 40.5946 110.021 40.3018 109.311C40.0089 108.6 39.8582 107.839 39.8584 107.07V96.4873C39.857 90.2299 37.381 84.2292 32.9746 79.8047C28.5683 75.3805 22.5925 72.8946 16.3613 72.8936H5.83105C4.28471 72.8936 2.80147 72.2767 1.70801 71.1787C0.614534 70.0807 0 68.5909 0 67.0381V45.8779C-3.24989e-08 45.1092 0.150352 44.3479 0.443359 43.6377C0.736402 42.9274 1.16655 42.2818 1.70801 41.7383C2.2494 41.1949 2.89234 40.7637 3.59961 40.4697C4.30695 40.1757 5.06552 40.0242 5.83105 40.0244H26.9033ZM66.7617 0C68.3081 0 69.7913 0.617788 70.8848 1.71582C71.9781 2.81383 72.5928 4.30273 72.5928 5.85547V16.4297C72.5933 22.6872 75.0685 28.6884 79.4746 33.1133C83.8808 37.5382 89.8573 40.0245 96.0889 40.0254H106.619C107.385 40.0243 108.144 40.1751 108.853 40.4688C109.561 40.7624 110.204 41.1928 110.746 41.7363C111.288 42.28 111.718 42.926 112.012 43.6367C112.305 44.3474 112.457 45.1095 112.457 45.8789V67.0391C112.457 68.5915 111.842 70.0808 110.749 71.1787C109.656 72.2765 108.173 72.8931 106.627 72.8936H85.5547C84.0084 72.8935 82.5251 72.2776 81.4316 71.1797C80.3382 70.0817 79.7247 68.5918 79.7246 67.0391V56.4648C79.7242 50.2078 77.2485 44.2068 72.8428 39.7822C68.4369 35.3576 62.4606 32.871 56.2295 32.8701H45.6895C44.9239 32.8701 44.1662 32.719 43.459 32.4248C42.7517 32.1305 42.1077 31.699 41.5664 31.1553C41.0253 30.6116 40.5965 29.966 40.3037 29.2559C40.0109 28.5455 39.8601 27.7844 39.8604 27.0156V5.85547C39.8601 5.08672 40.0109 4.32554 40.3037 3.61523C40.5965 2.90508 41.0253 2.25943 41.5664 1.71582C42.1077 1.17211 42.7517 0.739576 43.459 0.445312C44.1661 0.151199 44.924 -3.26271e-08 45.6895 0H66.7617Z`;
const LOGO_SVG_SIZE = 113;

// ── Shared state ─────────────────────────────────────────────────────────────
const state = {
  speed:      1.0,
  waveWidth:  0.62,
  direction:  'blink',
  color:      '#FFFFFF',
  minOpacity: 0.08,
  maxOpacity: 1.0,
  pulseMode:  'opacity',
  running:    true,
  dotRadius:  2.5,
  spacing:    7,
  tileSize:   28,
  tileGap:    8,
  gridW:        436,
  gridH:        148,
  recDuration:  3,
};

let activeView = 'v2';

// ── Utils ─────────────────────────────────────────────────────────────────────
const TAU = Math.PI * 2;
function lerp(a, b, t) { return a + (b - a) * t; }

let _colorCache = { hex: '', r: 255, g: 255, b: 255 };
function hexToRgb(hex) {
  if (hex === _colorCache.hex) return _colorCache;
  _colorCache = {
    hex,
    r: parseInt(hex.slice(1,3), 16),
    g: parseInt(hex.slice(3,5), 16),
    b: parseInt(hex.slice(5,7), 16),
  };
  return _colorCache;
}

function setupCanvas(canvas, w, h) {
  const dpr = window.devicePixelRatio || 1;
  canvas.width  = w * dpr;
  canvas.height = h * dpr;
  canvas.style.width  = w + 'px';
  canvas.style.height = h + 'px';
  const ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  return ctx;
}

function computePhases(dots, getX, getY) {
  if (!dots.length) return;
  let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
  for (const d of dots) {
    const x = getX(d), y = getY(d);
    if (x < minX) minX = x; if (x > maxX) maxX = x;
    if (y < minY) minY = y; if (y > maxY) maxY = y;
  }
  const rX = maxX - minX || 1;
  const rY = maxY - minY || 1;
  const midX = (minX + maxX) / 2;
  const midY = (minY + maxY) / 2;
  const maxR = Math.hypot(rX, rY) / 2 || 1;
  for (const d of dots) {
    const x = getX(d), y = getY(d);
    const pl = (x - minX) / rX;
    const pt = (y - minY) / rY;
    d.phases = {
      left:     pl,
      right:    1 - pl,
      top:      pt,
      bottom:   1 - pt,
      radial:   Math.hypot(x - midX, y - midY) / maxR,
      diagonal: (pl + pt) / 2,
    };
  }
}

// ═══════════════════════════════════════════════════════════════════════════
// VIEW 1 — Dot Fill
// ═══════════════════════════════════════════════════════════════════════════
const V1_SIZE = 360;
const c1 = document.getElementById('c1');
const ctx1 = setupCanvas(c1, V1_SIZE, V1_SIZE);

const logoPath2D = new Path2D(SVG_PATH_D);
const SCALE1 = V1_SIZE / LOGO_SVG_SIZE;

let v1Dots = [];
let spacingDebounce = null;

function buildDots() {
  const step = state.spacing / SCALE1;
  const hitCanvas = document.createElement('canvas');
  hitCanvas.width  = LOGO_SVG_SIZE;
  hitCanvas.height = LOGO_SVG_SIZE;
  const hitCtx = hitCanvas.getContext('2d');

  const dots = [];
  for (let y = 0; y <= LOGO_SVG_SIZE; y += step) {
    for (let x = 0; x <= LOGO_SVG_SIZE; x += step) {
      if (hitCtx.isPointInPath(logoPath2D, x, y, 'nonzero')) {
        dots.push({ x, y, cx: x * SCALE1, cy: y * SCALE1, phaseOffset: Math.random(), phases: {} });
      }
    }
  }
  v1Dots = dots;
  computePhases(v1Dots, d => d.x, d => d.y);
  document.getElementById('statCount').textContent = dots.length;
  document.getElementById('statUnit').textContent = 'dots';
}

let v1Base = null, v1PauseOffset = 0, v1PausedAt = null, v1Raf = null;
let v1FpsTimes = [];

function v1Animate(ts) {
  if (!state.running || activeView !== 'v1') return;
  if (v1Base === null) v1Base = ts;
  const elapsed = (ts - v1Base - v1PauseOffset) / 1000;

  ctx1.clearRect(0, 0, V1_SIZE, V1_SIZE);

  const { r, g, b } = hexToRgb(state.color);
  const { speed, waveWidth, direction, minOpacity, maxOpacity, pulseMode, dotRadius } = state;
  const minR = dotRadius * 0.35;
  const scaleMode = pulseMode === 'scale' || pulseMode === 'both';

  for (const d of v1Dots) {
    const phase = direction === 'blink' ? d.phaseOffset : (d.phases[direction] ?? 0) / waveWidth;
    const t = (Math.sin((phase - elapsed * speed) * TAU) + 1) / 2;
    const opacity = lerp(minOpacity, maxOpacity, t);
    const radius  = scaleMode ? lerp(minR, dotRadius, t) : dotRadius;
    ctx1.beginPath();
    ctx1.arc(d.cx, d.cy, radius, 0, TAU);
    ctx1.fillStyle = 'rgba(' + r + ',' + g + ',' + b + ',' + opacity.toFixed(3) + ')';
    ctx1.fill();
  }

  v1FpsTimes.push(ts);
  if (v1FpsTimes.length > 30) v1FpsTimes.shift();
  if (v1FpsTimes.length > 1) {
    const fps = Math.round((v1FpsTimes.length - 1) / ((v1FpsTimes[v1FpsTimes.length-1] - v1FpsTimes[0]) / 1000));
    document.getElementById('statFps').textContent = fps;
  }

  v1Raf = requestAnimationFrame(v1Animate);
}

function v1Start() { v1Raf = requestAnimationFrame(v1Animate); }
function v1Pause() { if (v1Raf) { cancelAnimationFrame(v1Raf); v1Raf = null; } v1PausedAt = performance.now(); }
function v1Resume() {
  if (v1PausedAt !== null) { v1PauseOffset += performance.now() - v1PausedAt; v1PausedAt = null; }
  v1Start();
}

// ═══════════════════════════════════════════════════════════════════════════
// VIEW 2 — Logo Grid
// ═══════════════════════════════════════════════════════════════════════════
const c2 = document.getElementById('c2');
let ctx2 = setupCanvas(c2, state.gridW, state.gridH);

function resizeCanvas2() {
  ctx2 = setupCanvas(c2, state.gridW, state.gridH);
}

let v2Tiles = [];

function buildTiles() {
  const { tileSize, tileGap } = state;
  const step = tileSize + tileGap;
  const { gridW, gridH } = state;
  const cols = Math.ceil(gridW / step) + 1;
  const rows = Math.ceil(gridH / step) + 1;
  const totalW = (cols - 1) * step + tileSize;
  const totalH = (rows - 1) * step + tileSize;
  const offX = (gridW - totalW) / 2;
  const offY = (gridH - totalH) / 2;

  const tiles = [];
  for (let row = 0; row < rows; row++) {
    for (let col = 0; col < cols; col++) {
      tiles.push({ col, row, tx: offX + col * step, ty: offY + row * step, phaseOffset: Math.random(), phases: {} });
    }
  }
  v2Tiles = tiles;
  computePhases(v2Tiles, d => d.col, d => d.row);
  document.getElementById('statCount').textContent = tiles.length;
  document.getElementById('statUnit').textContent = 'tiles';
}

let v2Base = null, v2PauseOffset = 0, v2PausedAt = null, v2Raf = null;
let v2FpsTimes = [];

function v2Animate(ts) {
  if (!state.running || activeView !== 'v2') return;
  if (v2Base === null) v2Base = ts;
  const elapsed = (ts - v2Base - v2PauseOffset) / 1000;

  ctx2.clearRect(0, 0, state.gridW, state.gridH);

  const { r, g, b } = hexToRgb(state.color);
  const { speed, waveWidth, direction, minOpacity, maxOpacity, pulseMode, tileSize } = state;
  const logoScale = tileSize / LOGO_SVG_SIZE;
  const minScale = 0.35;
  const scaleMode = pulseMode === 'scale' || pulseMode === 'both';

  for (const tile of v2Tiles) {
    const phase = direction === 'blink' ? tile.phaseOffset : (tile.phases[direction] ?? 0) / waveWidth;
    const t = (Math.sin((phase - elapsed * speed) * TAU) + 1) / 2;
    const opacity = lerp(minOpacity, maxOpacity, t);
    const sc = scaleMode ? lerp(logoScale * minScale, logoScale, t) : logoScale;
    const cx = tile.tx + tileSize / 2;
    const cy = tile.ty + tileSize / 2;

    ctx2.save();
    ctx2.globalAlpha = opacity;
    ctx2.fillStyle = 'rgb(' + r + ',' + g + ',' + b + ')';
    ctx2.translate(cx, cy);
    ctx2.scale(sc, sc);
    ctx2.translate(-LOGO_SVG_SIZE / 2, -LOGO_SVG_SIZE / 2);
    ctx2.fill(logoPath2D);
    ctx2.restore();
  }

  v2FpsTimes.push(ts);
  if (v2FpsTimes.length > 30) v2FpsTimes.shift();
  if (v2FpsTimes.length > 1) {
    const fps = Math.round((v2FpsTimes.length - 1) / ((v2FpsTimes[v2FpsTimes.length-1] - v2FpsTimes[0]) / 1000));
    document.getElementById('statFps').textContent = fps;
  }

  v2Raf = requestAnimationFrame(v2Animate);
}

function v2Start() { v2Raf = requestAnimationFrame(v2Animate); }
function v2Pause() { if (v2Raf) { cancelAnimationFrame(v2Raf); v2Raf = null; } v2PausedAt = performance.now(); }
function v2Resume() {
  if (v2PausedAt !== null) { v2PauseOffset += performance.now() - v2PausedAt; v2PausedAt = null; }
  v2Start();
}

// ═══════════════════════════════════════════════════════════════════════════
// Controls
// ═══════════════════════════════════════════════════════════════════════════
function bindSlider(id, valId, key, fmt, onChange) {
  const sl = document.getElementById(id);
  const vl = document.getElementById(valId);
  sl.addEventListener('input', () => {
    state[key] = parseFloat(sl.value);
    vl.textContent = fmt ? fmt(state[key]) : state[key];
    if (onChange) onChange();
  });
}

// ═══════════════════════════════════════════════════════════════════════════
// GIF Recording
// ═══════════════════════════════════════════════════════════════════════════
const GIF_FPS = 15;
const GIF_FRAME_DELAY = Math.round(1000 / GIF_FPS);
let recState = 'idle'; // 'idle' | 'capturing' | 'rendering'
let recFrameInterval = null;
let gifWorkerUrl = null;

fetch('https://cdn.jsdelivr.net/npm/gif.js@0.2.0/dist/gif.worker.js')
  .then(r => r.text())
  .then(src => {
    gifWorkerUrl = URL.createObjectURL(new Blob([src], { type: 'text/javascript' }));
  });

function setRecUI(label, active, progress) {
  const recBtn  = document.getElementById('recBtn');
  const recLabel = document.getElementById('recLabel');
  const progWrap = document.getElementById('recProgress');
  const progBar  = document.getElementById('recProgressBar');
  recLabel.textContent = label;
  recBtn.classList.toggle('recording', active);
  recBtn.disabled = recState === 'rendering';
  if (progress != null) {
    progWrap.classList.add('active');
    progBar.style.width = (progress * 100).toFixed(1) + '%';
  } else {
    progWrap.classList.remove('active');
    progBar.style.width = '0%';
  }
}

function startRecording() {
  if (recState !== 'idle') return;
  if (!gifWorkerUrl) { alert('GIF worker not ready yet, try again in a moment.'); return; }

  const canvas   = activeView === 'v1' ? c1 : c2;
  const dpr      = window.devicePixelRatio || 1;
  const total    = Math.round(GIF_FPS * state.recDuration);
  let   captured = 0;

  const gif = new GIF({
    workers:      2,
    quality:      8,
    workerScript: gifWorkerUrl,
    repeat:       0,
    width:        canvas.width  / dpr,
    height:       canvas.height / dpr,
  });

  recState = 'capturing';
  setRecUI('0s', true, 0);

  recFrameInterval = setInterval(() => {
    gif.addFrame(canvas, { delay: GIF_FRAME_DELAY, copy: true });
    captured++;
    const elapsed = Math.floor(captured / GIF_FPS);
    setRecUI(elapsed + 's / ' + state.recDuration + 's', true, captured / total);

    if (captured >= total) {
      clearInterval(recFrameInterval);
      recState = 'rendering';
      setRecUI('Rendering…', true, 1);

      gif.on('progress', p => setRecUI(Math.round(p * 100) + '%', true, p));
      gif.on('finished', blob => {
        const url = URL.createObjectURL(blob);
        const a   = document.createElement('a');
        a.href     = url;
        a.download = 'squint-animation.gif';
        a.click();
        URL.revokeObjectURL(url);
        recState = 'idle';
        setRecUI('Rec', false, null);
      });
      gif.render();
    }
  }, GIF_FRAME_DELAY);
}

function stopRecording() {
  if (recState !== 'capturing') return;
  clearInterval(recFrameInterval);
  recState = 'idle';
  setRecUI('Rec', false, null);
}

function setupControls() {
  bindSlider('slSpeed',   'valSpeed',   'speed',      v => v.toFixed(2));
  bindSlider('slWave',    'valWave',    'waveWidth',  v => v.toFixed(2));
  bindSlider('slMinOp',   'valMinOp',   'minOpacity', v => v.toFixed(2));
  bindSlider('slMaxOp',   'valMaxOp',   'maxOpacity', v => v.toFixed(2));
  bindSlider('slDotR',    'valDotR',    'dotRadius',  v => v + 'px');
  bindSlider('slSpacing', 'valSpacing', 'spacing',    v => v + 'px', () => {
    clearTimeout(spacingDebounce);
    spacingDebounce = setTimeout(buildDots, 150);
  });
  bindSlider('slTileSize', 'valTileSize', 'tileSize', v => v + 'px', buildTiles);
  bindSlider('slTileGap',  'valTileGap',  'tileGap',  v => v + 'px', buildTiles);

  function applyGridResize() {
    resizeCanvas2();
    buildTiles();
  }

  // Width slider — if an aspect preset is locked, sync height
  document.getElementById('slGridW').addEventListener('input', function() {
    state.gridW = parseInt(this.value);
    document.getElementById('valGridW').textContent = state.gridW + 'px';
    const active = document.querySelector('#aspectSeg .seg-btn.active');
    if (active && active.dataset.aspect !== 'free') {
      const [aw, ah] = active.dataset.aspect.split(':').map(Number);
      state.gridH = Math.round(state.gridW * ah / aw / 4) * 4;
      state.gridH = Math.max(120, Math.min(560, state.gridH));
      const slH = document.getElementById('slGridH');
      slH.value = state.gridH;
      document.getElementById('valGridH').textContent = state.gridH + 'px';
    }
    applyGridResize();
  });

  // Height slider — if an aspect preset is locked, sync width
  document.getElementById('slGridH').addEventListener('input', function() {
    state.gridH = parseInt(this.value);
    document.getElementById('valGridH').textContent = state.gridH + 'px';
    const active = document.querySelector('#aspectSeg .seg-btn.active');
    if (active && active.dataset.aspect !== 'free') {
      const [aw, ah] = active.dataset.aspect.split(':').map(Number);
      state.gridW = Math.round(state.gridH * aw / ah / 4) * 4;
      state.gridW = Math.max(160, Math.min(720, state.gridW));
      const slW = document.getElementById('slGridW');
      slW.value = state.gridW;
      document.getElementById('valGridW').textContent = state.gridW + 'px';
    }
    applyGridResize();
  });

  // Aspect ratio presets
  document.querySelectorAll('#aspectSeg .seg-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('#aspectSeg .seg-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      const aspect = btn.dataset.aspect;
      if (aspect === 'free') return;
      const [aw, ah] = aspect.split(':').map(Number);
      state.gridH = Math.round(state.gridW * ah / aw / 4) * 4;
      state.gridH = Math.max(120, Math.min(560, state.gridH));
      const slH = document.getElementById('slGridH');
      slH.value = state.gridH;
      document.getElementById('valGridH').textContent = state.gridH + 'px';
      applyGridResize();
    });
  });

  document.querySelectorAll('.dir-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.dir-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      state.direction = btn.dataset.dir;
    });
  });

  document.querySelectorAll('.seg-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.seg-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      state.pulseMode = btn.dataset.pulse;
    });
  });

  const picker  = document.getElementById('colorPicker');
  const swatch  = document.getElementById('swatchWrap');
  const hexSpan = document.getElementById('colorHex');
  picker.addEventListener('input', () => {
    state.color = picker.value;
    swatch.style.background = picker.value;
    hexSpan.textContent = picker.value.toUpperCase();
    _colorCache.hex = '';
  });

  const pauseBtn   = document.getElementById('pauseBtn');
  const pauseIcon  = document.getElementById('pauseIcon');
  const pauseLabel = document.getElementById('pauseLabel');
  pauseBtn.addEventListener('click', () => {
    state.running = !state.running;
    if (state.running) {
      pauseBtn.classList.remove('paused');
      pauseIcon.textContent  = '⏸';
      pauseLabel.textContent = 'Pause';
      if (activeView === 'v1') v1Resume(); else v2Resume();
    } else {
      pauseBtn.classList.add('paused');
      pauseIcon.textContent  = '▶';
      pauseLabel.textContent = 'Resume';
      if (activeView === 'v1') v1Pause(); else v2Pause();
    }
  });

  document.getElementById('recBtn').addEventListener('click', () => {
    if (recState === 'capturing') stopRecording();
    else if (recState === 'idle') startRecording();
  });

  document.querySelectorAll('#durSeg .seg-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('#durSeg .seg-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      state.recDuration = parseInt(btn.dataset.dur);
    });
  });

  document.querySelectorAll('.tab').forEach(tab => {
    tab.addEventListener('click', () => {
      const view = tab.dataset.view;
      if (view === activeView) return;
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      tab.classList.add('active');

      c1.classList.toggle('hidden', view !== 'v1');
      c2.classList.toggle('hidden', view !== 'v2');
      document.getElementById('secV1').classList.toggle('hidden', view !== 'v1');
      document.getElementById('secV2').classList.toggle('hidden', view !== 'v2');

      if (activeView === 'v1') { if (v1Raf) { cancelAnimationFrame(v1Raf); v1Raf = null; } }
      else                     { if (v2Raf) { cancelAnimationFrame(v2Raf); v2Raf = null; } }

      activeView = view;

      document.getElementById('statCount').textContent =
        view === 'v1' ? v1Dots.length : v2Tiles.length;
      document.getElementById('statUnit').textContent =
        view === 'v1' ? 'dots' : 'tiles';

      if (state.running) {
        if (view === 'v1') v1Start(); else v2Start();
      }
    });
  });
}

window.addEventListener('DOMContentLoaded', () => {
  setupControls();
  buildDots();
  buildTiles();
  document.getElementById('statCount').textContent = v2Tiles.length;
  document.getElementById('statUnit').textContent = 'tiles';
  v2Start();
});
</script>
</body>
</html>
